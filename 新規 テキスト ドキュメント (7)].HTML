<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Discord Bot 総合管理コンソール</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; margin: 0; }
        h1 { color: #38bdf8; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px: #334155; }
        h3 { margin-top: 0; color: #38bdf8; border-bottom: 2px solid #334155; padding-bottom: 8px; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; font-size: 15px; background: #0f172a; color: white; border: 1px solid #475569; border-radius: 6px; box-sizing: border-box; }
        button { background: #6366f1; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background: #4f46e5; }
        .danger { background: #ef4444; }
        .danger:hover { background: #dc2626; }
        .success { background: #22c55e; }
        .success:hover { background: #16a34a; }
        .log-box { background: #020617; padding: 10px; border-radius: 6px; height: 120px; overflow-y: scroll; font-family: monospace; font-size: 13px; color: #38bdf8; }
    </style>
</head>
<body>
    <h1>🚀 Discord Bot 総合管理ダッシュボード</h1>

    <div class="grid">
        <!-- 1. ユーザー管理・ブラックリスト -->
        <div class="card">
            <h3>🚫 ブラックリスト管理</h3>
            <p>ボットを使えなくするユーザーのIDを指定</p>
            <input type="text" id="banUserId" placeholder="Discord IDを入力">
            <button class="danger" onclick="addBlacklist()">ブラックリストに追加</button>
            <button class="success" onclick="removeBlacklist()">ブラックリストから解除</button>
        </div>

        <!-- 2. ボットの遠隔操作 -->
        <div class="card">
            <h3>⚙️ ボット本体の制御</h3>
            <p>ボットの動作をリモートで切り替え</p>
            <button onclick="botAction('start')">🟢 全機能スタート</button>
            <button class="danger" onclick="botAction('emergency_stop')">🔴 緊急停止 (ストップ)</button>
            <button onclick="botAction('status_check')">📊 ステータス確認</button>
        </div>

        <!-- 3. アナウンス・一斉送信 -->
        <div class="card">
            <h3>📢 サーバー一斉操作</h3>
            <p>全導入サーバーにメッセージを送信</p>
            <input type="text" id="broadcastMsg" placeholder="送信するメッセージ内容">
            <button onclick="sendBroadcast()">一斉送信を実行</button>
        </div>

        <!-- 4. リアルタイムログ監視 -->
        <div class="card">
            <h3>🖥️ リアルタイム操作ログ</h3>
            <div class="log-box" id="logArea">
                [システム] コンソール画面を起動しました。<br>
                [準備完了] 操作のスタンバイ中...
            </div>
            <button onclick="clearLogs()" style="background: #475569; margin-top: 10px;">ログをクリア</button>
        </div>
    </div>

    <script>
        function addBlacklist() {
            const id = document.getElementById('banUserId').value;
            if(!id) return alert('IDを入力してください');
            addLog(`[追加] ユーザーID: ${id} をブラックリストに追加しました。`);
            document.getElementById('banUserId').value = '';
        }

        function removeBlacklist() {
            const id = document.getElementById('banUserId').value;
            if(!id) return alert('IDを入力してください');
            addLog(`[解除] ユーザーID: ${id} をブラックリストから外しました。`);
            document.getElementById('banUserId').value = '';
        }

        function botAction(actionType) {
            if(actionType === 'start') {
                addLog('[制御] ボットの全機能を有効化しました。');
            } else if(actionType === 'emergency_stop') {
                addLog('[警告] ボットに緊急停止命令を出しました！');
            } else if(actionType === 'status_check') {
                addLog('[情報] Bot稼働中 | 接続サーバー数: 1 | 安定稼働中');
            }
        }

        function sendBroadcast() {
            const msg = document.getElementById('broadcastMsg').value;
            if(!msg) return alert('メッセージを入力してください');
            addLog(`[一斉送信] 「${msg}」を送信しました。`);
            document.getElementById('broadcastMsg').value = '';
        }

        function addLog(text) {
            const logArea = document.getElementById('logArea');
            const time = new Date().toLocaleTimeString();
            logArea.innerHTML += `[${time}] ${text}<br>`;
            logArea.scrollTop = logArea.scrollHeight;
        }

        function clearLogs() {
            document.getElementById('logArea').innerHTML = '[システム] ログをクリアしました。<br>';
        }
    </script>
</body>
</html>
